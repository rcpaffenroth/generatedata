[project]
name = "generatedata"
version = "0.4.3"
description = "Library of code to generate synthetic data for testing and benchmarking machine learning algorithms in a consistent dynamical systems setting."
authors = [{name = "Randy Paffenroth", email = "rcpaffenroth@wpi.edu"}]
license = {text = "BSD 3-Clause License"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "numpy>=2.1,<3",
    "mnist1d>=0.0.2",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    # Used directly to decode the PNG-encoded images in the CIFAR-10 parquet
    # files; previously only present as a transitive torchvision dependency.
    "pillow>=10",
    "matplotlib>=3.9,<4",
    "plotly>=5.24,<7",
    # plotly >=6 moved go.FigureWidget behind this optional dependency
    "anywidget>=0.9,<1",
    "requests>=2.28,<3",
    "ipykernel>=6.29,<7",
    "ipympl>=0.9,<1",
    "jupyterlab>=4.3,<5",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pylint>=3.2,<4",
    "nbmake>=1.5,<2",
    "jupytext>=1.16,<2",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--nbmake"
testpaths = [
    "tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
